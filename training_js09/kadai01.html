<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>9-1</title>
</head>

<body>
<h1 class ="center">Click Counter ★ for構文</h1>
<p class ="center">ボタンをクリックすると、クリック回数に応じて結果が変わります。</p>
<p class ="center">JavaScriptのfor構文を使って処理を作ってみましょう。</p>
<p class ="center">クリック回数　<span id="count">0</span>回</p>
<button onclick="countup()">クリック</button>
<p>結果</p>
<p id="result">ここに結果が表示されます</p>

<script>
    let clickcount = 0;
    function countup(){
        clickcount++;
        let result = "";
        if(clickcount == 1){
            for(let i = 0; i < 1; i++){
                result += "★";
            }
        }else if(clickcount == 2){
            for(let i = 0; i < 5; i++){
                result += "★";
            }
        }else if(clickcount == 3){
            for(let i = 1; i <= 5; i++){
                result += i + " ";
            }
        }else if(clickcount == 4){
            for(let i = 2; i <= 10; i += 2){
                result += i + " ";
            }
        }else if(clickcount == 5){
            let sum = 0;
            for(let i = 1; i <= clickcount; i++){
                sum += i ;
            }
            result = sum;
        }else{
            result = "クリアしました。カウントを0に戻します。"
            clickcount = 0;
        }
        document.getElementById("result").textContent = result;
        document.getElementById("count").textContent = clickcount;

    }

</script>
<style>
    .center{
        text-align: center;
    }
    #result{
        text-align: center;
    }

</style>
</body>

</html>
