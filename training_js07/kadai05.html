<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>7-5</title>
</head>

<body>
<p id="text"></p>
<script>

function sum1(a, b) {
    return a + b;
}
const sum = (a, b) => a + b;


function fibo1(n) {
    if (n < 2) {
        return n;
    }
    return fibo1(n - 1) + fibo1(n - 2);
}
const fibo = (n) => n < 2 ? n : fibo(n - 1) + fibo(n - 2);

function betweenOrBound1(low, high, n) {
    return n < low ? low : (n > high ? high : n);
}


const betweenOrBound = (low, high, n) => {
    if (n >= low && n <= high)
        return n;
    else if (n < low)
        return low;
    else
        return high;
}
const a = Number(prompt("1つ目の数字"));
const b = Number(prompt("2つ目の数字"));
document.getElementById("text").innerHTML =
    sum1(a, b) + "<br>" +
    sum(a, b) + "<br>" +
    fibo1(a) + "<br>" +
    fibo1(b) + "<br>" +
    fibo(a) + "<br>" +
    fibo(b) + "<br>" +
    betweenOrBound1(a, b, a) + "<br>" +
    betweenOrBound1(a, b, b) + "<br>" +
    betweenOrBound(a, b, a) + "<br>" +
    betweenOrBound(a, b, b);
</script>
</body>

</html>
