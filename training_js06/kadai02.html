<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>要素の取得と内容の変更</title>
<style>
    #book{
        color: red;
    }
</style>
</head>

<body>
<h2>座席の予約</h2>
<p>東京会場<strong id="book">（予約受付中）</strong></p>
<p id="thankyou"><button onclick="booking()">予約する</button></p>

<script>
function booking() {
    let done = document.getElementById('book');
    done.innerHTML = '<b>（予約済み）</b><br>';
    let thank = document.getElementById('thankyou');
    thank.innerHTML = '<b>ありがとうございました。</b>';
}
</script>
</body>

</html>
