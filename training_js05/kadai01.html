<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>変数の利用</title>
</head>

<body>
<h2>変数の演算</h2>
<p>a=10、b=4の場合</p>
<button onclick="show1()">足し算</button>
<button onclick="show2()">引き算</button>
<button onclick="show3()">掛け算</button>
<button onclick="show4()">割り算</button>
<script>
let a = 10;
let b = 4;
function show1() {
    c = a + b;
    alert(c);
}
function show2() {
    c = a - b;
    alert(c);
}
function show3() {
    c = a * b;
    alert(c);
}
function show4() {
    c = a / b;
    alert(c);
}
</script>
</body>

</html>
